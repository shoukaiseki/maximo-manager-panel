# p6spy 配置 - SQL 日志打印
# 日志输出格式: 自定义格式(原始SQL与实际SQL各占一行, 便于复制)
logMessageFormat=com.sks.server.config.SqlLogFormat

# 自定义 appender：同时输出到控制台 与 ${user.home}/logs/sql.log
appender=com.sks.server.config.SqlLogAppender

# 不打印这些类别的日志（减少噪音）
excludecategories=debug,info,result,resultset,batch

# 慢 SQL 检测（超过 200ms 的 SQL 会额外打印警告）
outagedetection=true
outagedetectioninterval=200
